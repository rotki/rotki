[package]
name = "colibri"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
# For logging
log = "=0.4.29"
# For the asynchronous Rest API
reqwest = { version = "=0.13.2", default-features = false, features = ["json", "query", "rustls-no-provider"]}
rustls = { version = "=0.23.40", default-features = false, features = ["ring", "std", "tls12"] }
# `signal` powers the graceful-shutdown hook in main: starling stops us with
# CTRL_BREAK (windows) / SIGTERM (unix), and without a handler the OS default
# terminator kills us mid-flight instead of letting us close the database.
tokio = { workspace = true, features = ["rt-multi-thread", "fs", "signal"] }
axum.workspace = true
# for serialization of structs via the API
serde.workspace = true
# For reading / manipulating json data from a string response
serde_json.workspace = true
# For md5 checksum in icon cache matching
md5 = "=0.8.0"
# To retrieve OS-specific directories
dirs.workspace = true
# for CLI args parsing
clap = { workspace = true, features = ["string"] }
# for globalDB and other sqlite operations
rusqlite = { version = "=0.39.0", features = ["bundled", "bundled-sqlcipher-vendored-openssl"] }
async-sqlite = {version = "=0.5.7" }
# for cors and network
tower-http = { workspace = true, features = ["cors", "trace"] }
# for detailed logs when requests happen. Tracing in maintained by the tokio team and it helps
# to log events in multithread environments. It is used by axum (also by tokio) to signal when
# a request happens and keeps information about it. We use tracing to extract those events and
# log them.
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["ansi", "fmt", "tracing-log"] }
# Used to keep log files that rotate when they reach certain size. Is not available in tracing
# directly (they have a PR but not merged)
file-rotate = "=0.8.0"
# used when parsing cors. It is from rust itself
glob = "=0.3.3"
# for hex encoding/decoding in ABI calls
hex = "=0.4.3"
base64 = "=0.22.1"
thiserror.workspace = true
# Used for Levenshtein distance in asset search to mirror Python's behavior.
strsim = "=0.11.1"
# HMAC-SHA256 to validate the signed session cookie (Docker), minted by core
hmac = "=0.12.1"
sha2 = "=0.10.9"
# EIP-55 checksum validation for EVM addresses
sha3 = "=0.10.9"
# constant-time comparison for the session-cookie signature check
subtle = "=2.6.1"

[dev-dependencies]
mockito = "=1.7.2"
tokio = { workspace = true, features = ["test-util"] }
rand = "=0.10.1"
regex = "=1.12.3"
# `oneshot` for exercising the session middleware in tests
tower.workspace = true
