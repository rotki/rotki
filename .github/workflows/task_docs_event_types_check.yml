name: Check event-types docs sync

on:
  pull_request:
    branches:
      - master
      - develop
      - bugfixes
    paths:
      - 'rotkehlchen/history/events/structures/types.py'
      - 'rotkehlchen/accounting/constants.py'
      - 'tools/scripts/generate_event_types_docs.py'
  push:
    branches:
      - master
      - develop
      - bugfixes
    paths:
      - 'rotkehlchen/history/events/structures/types.py'
      - 'rotkehlchen/accounting/constants.py'
      - 'tools/scripts/generate_event_types_docs.py'

permissions: { }

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check-event-types-docs:
    name: 'Event types docs sync'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout main repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Load env
        uses: rotki/action-env@39fabde543b2b2f163b8ecce6570473bccc4e2c1  # v4.0.1
        with:
          env_file: .github/.env.ci

      - name: Setup python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          freethreaded: true

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.2.0
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --no-dev --group lint

      - name: Checkout docs repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: rotki/docs
          ref: main
          path: _docs
          persist-credentials: false

      - name: Check event-types.md is in sync
        run: |
          uv run python tools/scripts/generate_event_types_docs.py \
            --check _docs/usage-guides/tax-accounting/event-types.md
