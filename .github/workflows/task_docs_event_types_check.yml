name: Check event-types docs sync

on:
  pull_request:
    branches:
      - master
      - develop
      - bugfixes
    paths:
      - 'rotkehlchen/history/events/structures/types.py'
      - 'rotkehlchen/accounting/constants.py'
      - 'tools/scripts/generate_event_types_docs.py'
  push:
    branches:
      - master
      - develop
      - bugfixes
    paths:
      - 'rotkehlchen/history/events/structures/types.py'
      - 'rotkehlchen/accounting/constants.py'
      - 'tools/scripts/generate_event_types_docs.py'

permissions: { }

jobs:
  check-event-types-docs:
    name: 'Event types docs sync'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout main repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Load env
        uses: rotki/action-env@49f59e650cfdc8796c4ac6533ec044b190d83f9a  # v4.0.0
        with:
          env_file: .github/.env.ci

      - name: Setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          freethreaded: true

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --no-dev --group lint

      - name: Checkout docs repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: rotki/docs
          ref: main
          path: _docs
          persist-credentials: false

      - name: Check event-types.md is in sync
        run: |
          uv run python tools/scripts/generate_event_types_docs.py \
            --check _docs/usage-guides/tax-accounting/event-types.md
