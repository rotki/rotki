name: Check event-types docs sync

on:
  pull_request:
    branches:
      - master
      - develop
      - bugfixes
    paths:
      - 'rotkehlchen/history/events/structures/types.py'
      - 'rotkehlchen/accounting/constants.py'
      - 'tools/scripts/generate_event_types_docs.py'
  push:
    branches:
      - master
      - develop
      - bugfixes
    paths:
      - 'rotkehlchen/history/events/structures/types.py'
      - 'rotkehlchen/accounting/constants.py'
      - 'tools/scripts/generate_event_types_docs.py'

permissions: { }

jobs:
  check-event-types-docs:
    name: 'Event types docs sync'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout main repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Load env
        uses: rotki/action-env@49f59e650cfdc8796c4ac6533ec044b190d83f9a  # v4.0.0
        with:
          env_file: .github/.env.ci

      - name: Setup python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --no-dev --group lint

      - name: Checkout docs repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: rotki/docs
          ref: main
          path: _docs
          persist-credentials: false

      - name: Check event-types.md is in sync
        run: |
          uv run python tools/scripts/generate_event_types_docs.py \
            --check _docs/usage-guides/tax-accounting/event-types.md
