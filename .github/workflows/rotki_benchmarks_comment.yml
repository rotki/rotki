name: Benchmark PR comment

# Posts the benchmark comparison as a PR comment. Runs separately from the
# Benchmarks workflow because pull_request jobs from forks only get a
# read-only token; workflow_run executes in repo context with write access.
# Note: workflow_run only triggers once this file is on the default branch.

on:
  workflow_run:  # zizmor: ignore[dangerous-triggers] no checkout, PR number reduced to digits, body posted from a file
    workflows: [ Benchmarks ]
    types: [ completed ]

permissions: { }

# A newer benchmark run of the same branch replaces the comment anyway.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  comment:
    name: 'Comment results on the PR'
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read  # download the bench-compare artifact of the triggering run
      pull-requests: write  # post or update the results comment
    steps:
      - name: Download benchmark results
        id: download
        continue-on-error: true  # non-labeled PR runs produce no artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: bench-compare
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Post or update the comment
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          PR_NUMBER=$(tr -cd '0-9' < pr-number.txt)
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR number in artifact, skipping"
            exit 0
          fi
          gh pr comment "$PR_NUMBER" \
            --repo "$REPO" \
            --body-file bench-compare.md \
            --edit-last \
            --create-if-none
