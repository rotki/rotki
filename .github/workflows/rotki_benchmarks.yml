name: Benchmarks

on:
  pull_request:
    types: [ opened, synchronize, reopened, labeled ]
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions: { }

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  bench-pr:
    name: 'PR benchmark comparison'
    # opt-in via the run-benchmarks label or a [bench] tag in the PR title.
    # This job runs unprivileged (fork PRs get a read-only token); the PR
    # comment is posted by rotki_pr_comment.yml via workflow_run.
    if: github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'run-benchmarks') || contains(github.event.pull_request.title, '[bench]'))
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CI: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # compare needs the merge-base and a worktree of it
          persist-credentials: false

      - name: Load env
        uses: rotki/action-env@39fabde543b2b2f163b8ecce6570473bccc4e2c1  # v4.0.1
        with:
          env_file: .github/.env.ci

      - name: Setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}
          cache-dependency-glob: "uv.lock"

      - name: Cache scenario profiles
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/rotki-scenarios
          key: scenario-profiles-${{ hashFiles('tools/scenarios/**/*.py', 'rotkehlchen/data/global.db', 'rotkehlchen/db/settings.py', 'rotkehlchen/db/schema.py', 'rotkehlchen/db/minimized_schema.py') }}

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run comparison against the merge-base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          uv run python -m tools.bench compare \
            --base "origin/${BASE_REF}" \
            --samples 5 \
            --output bench-compare.json \
            --markdown bench-compare.md

      - name: Publish results to the run summary
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          cat bench-compare.md >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/pr-comment"
          cp bench-compare.md "$RUNNER_TEMP/pr-comment/comment.md"
          echo "$PR_NUMBER" > "$RUNNER_TEMP/pr-comment/pr-number.txt"

      - name: Upload the PR comment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pr-comment
          path: ${{ runner.temp }}/pr-comment/
          if-no-files-found: error
          retention-days: 1

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bench-compare
          path: |
            bench-compare.json
            bench-compare.md
          if-no-files-found: ignore

  bench-nightly:
    name: 'Nightly benchmark trend'
    if: github.event_name != 'pull_request' && (github.repository == 'rotki/rotki' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Each measured rotki branch gets its own data series (directory) in
        # the benchmark-data repo; the schedule itself only fires from the
        # default branch, so the sources are checked out explicitly here.
        branch: [ develop, bugfixes ]
    env:
      CI: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check harness availability
        id: harness
        # skip gracefully on branches the framework has not been merged into yet
        run: echo "present=$([ -d tools/bench ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Load env
        if: steps.harness.outputs.present == 'true'
        uses: rotki/action-env@39fabde543b2b2f163b8ecce6570473bccc4e2c1  # v4.0.1
        with:
          env_file: .github/.env.ci

      - name: Setup python
        if: steps.harness.outputs.present == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        if: steps.harness.outputs.present == 'true'
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}
          cache-dependency-glob: "uv.lock"

      - name: Cache scenario profiles
        if: steps.harness.outputs.present == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/rotki-scenarios
          key: scenario-profiles-${{ hashFiles('tools/scenarios/**/*.py', 'rotkehlchen/data/global.db', 'rotkehlchen/db/settings.py', 'rotkehlchen/db/schema.py', 'rotkehlchen/db/minimized_schema.py') }}

      - name: Install dependencies
        if: steps.harness.outputs.present == 'true'
        run: uv sync --locked --group dev

      - name: Run benchmarks
        if: steps.harness.outputs.present == 'true'
        run: |
          uv run python -m tools.bench run \
            --samples 5 \
            --output bench-result.json \
            --gha-output gha-benchmark.json

      - name: Checkout benchmark data
        if: steps.harness.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: rotki/benchmark-data
          ref: main
          path: benchmark-data
          persist-credentials: false

      - name: Check for benchmark regressions
        if: steps.harness.outputs.present == 'true'
        id: benchmark-alerts
        env:
          BRANCH: ${{ matrix.branch }}
        run: |
          ./.github/scripts/benchmark_alerts.py \
            --current gha-benchmark.json \
            --data-js "benchmark-data/macro/${BRANCH}/data.js" \
            --bench-name "rotki backend macro benchmarks (${BRANCH})" \
            --threshold 1.2 \
            --branch "$BRANCH" \
            --run-id "$GITHUB_RUN_ID" \
            --output bench-alert.md

      - name: Upload raw results
        if: always() && steps.harness.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bench-nightly-${{ matrix.branch }}
          path: |
            bench-result.json
            gha-benchmark.json
            bench-alert.md
          if-no-files-found: ignore

      - name: Name the datapoint
        if: steps.harness.outputs.present == 'true'
        env:
          BRANCH: ${{ matrix.branch }}
        # publish downloads every datapoint into one directory, so each file
        # needs a name of its own
        run: cp gha-benchmark.json "macro-${BRANCH}.json"

      - name: Upload datapoint
        if: steps.harness.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: datapoint-macro-${{ matrix.branch }}
          path: macro-${{ matrix.branch }}.json
          if-no-files-found: error
          retention-days: 1

  micro-nightly:
    name: 'Nightly micro-benchmark trend'
    if: github.event_name != 'pull_request' && (github.repository == 'rotki/rotki' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        branch: [ develop, bugfixes ]
    env:
      CI: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check suite availability
        id: suite
        # skip gracefully on branches the micro suite has not been merged into yet
        run: echo "present=$([ -d rotkehlchen/tests/benchmarks ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Load env
        if: steps.suite.outputs.present == 'true'
        uses: rotki/action-env@39fabde543b2b2f163b8ecce6570473bccc4e2c1  # v4.0.1
        with:
          env_file: .github/.env.ci

      - name: Setup python
        if: steps.suite.outputs.present == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        if: steps.suite.outputs.present == 'true'
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        if: steps.suite.outputs.present == 'true'
        run: uv sync --locked --group dev

      - name: Run micro-benchmarks
        if: steps.suite.outputs.present == 'true'
        run: |
          uv run pytest \
            -m benchmark \
            --benchmark-only \
            --benchmark-json=micro-benchmark.json \
            rotkehlchen/tests/benchmarks

      - name: Upload raw results
        if: always() && steps.suite.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: micro-nightly-${{ matrix.branch }}
          path: micro-benchmark.json
          if-no-files-found: ignore

      - name: Name the datapoint
        if: steps.suite.outputs.present == 'true'
        env:
          BRANCH: ${{ matrix.branch }}
        run: cp micro-benchmark.json "micro-${BRANCH}.json"

      - name: Upload datapoint
        if: steps.suite.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: datapoint-micro-${{ matrix.branch }}
          path: micro-${{ matrix.branch }}.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: 'Publish nightly datapoints'
    # The only job that can write to benchmark-data: the benchmark jobs run
    # from any ref or fork, while the benchmarks environment only admits
    # develop on rotki/rotki. One job, not a matrix, so a night records one
    # deployment and mints one token.
    if: ${{ always() && github.event_name != 'pull_request' && github.repository == 'rotki/rotki' && github.ref == 'refs/heads/develop' }}
    needs: [ bench-nightly, micro-nightly ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: benchmarks
    permissions:
      contents: read
    steps:
      - name: Download datapoints
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: datapoint-*
          path: datapoints
          merge-multiple: true

      - name: Create benchmark data token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ vars.BENCHMARK_DATA_APP_ID }}
          private-key: ${{ secrets.BENCHMARK_DATA_APP_KEY }}
          owner: rotki
          repositories: benchmark-data
          permission-contents: write

      # github-action-benchmark clones benchmark-data into
      # ./benchmark-data-repository and leaves the clone behind after a
      # successful push, so every push after the first starts by removing it.
      - name: Push macro datapoint (develop)
        if: ${{ !cancelled() && hashFiles('datapoints/macro-develop.json') != '' }}
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc  # v1.22.2
        with:
          name: 'rotki backend macro benchmarks (develop)'
          tool: 'customSmallerIsBetter'
          output-file-path: datapoints/macro-develop.json
          gh-repository: 'github.com/rotki/benchmark-data'
          gh-pages-branch: main
          benchmark-data-dir-path: macro/develop
          github-token: ${{ steps.app-token.outputs.token }}
          auto-push: true
          alert-threshold: '120%'
          comment-on-alert: false
          fail-on-alert: false

      - name: Remove the previous clone
        if: ${{ !cancelled() && hashFiles('datapoints/macro-bugfixes.json') != '' }}
        run: rm -rf benchmark-data-repository

      - name: Push macro datapoint (bugfixes)
        if: ${{ !cancelled() && hashFiles('datapoints/macro-bugfixes.json') != '' }}
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc  # v1.22.2
        with:
          name: 'rotki backend macro benchmarks (bugfixes)'
          tool: 'customSmallerIsBetter'
          output-file-path: datapoints/macro-bugfixes.json
          gh-repository: 'github.com/rotki/benchmark-data'
          gh-pages-branch: main
          benchmark-data-dir-path: macro/bugfixes
          github-token: ${{ steps.app-token.outputs.token }}
          auto-push: true
          alert-threshold: '120%'
          comment-on-alert: false
          fail-on-alert: false

      - name: Remove the previous clone
        if: ${{ !cancelled() && hashFiles('datapoints/micro-develop.json') != '' }}
        run: rm -rf benchmark-data-repository

      - name: Push micro datapoint (develop)
        if: ${{ !cancelled() && hashFiles('datapoints/micro-develop.json') != '' }}
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc  # v1.22.2
        with:
          name: 'rotki backend micro benchmarks (develop)'
          tool: 'pytest'
          output-file-path: datapoints/micro-develop.json
          gh-repository: 'github.com/rotki/benchmark-data'
          gh-pages-branch: main
          benchmark-data-dir-path: micro/develop
          github-token: ${{ steps.app-token.outputs.token }}
          auto-push: true
          # trend-only for now: micro timings on shared runners have unknown
          # variance; flip fail-on-alert once a few weeks of data establish it
          alert-threshold: '150%'
          comment-on-alert: false
          fail-on-alert: false

      - name: Remove the previous clone
        if: ${{ !cancelled() && hashFiles('datapoints/micro-bugfixes.json') != '' }}
        run: rm -rf benchmark-data-repository

      - name: Push micro datapoint (bugfixes)
        if: ${{ !cancelled() && hashFiles('datapoints/micro-bugfixes.json') != '' }}
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc  # v1.22.2
        with:
          name: 'rotki backend micro benchmarks (bugfixes)'
          tool: 'pytest'
          output-file-path: datapoints/micro-bugfixes.json
          gh-repository: 'github.com/rotki/benchmark-data'
          gh-pages-branch: main
          benchmark-data-dir-path: micro/bugfixes
          github-token: ${{ steps.app-token.outputs.token }}
          auto-push: true
          alert-threshold: '150%'
          comment-on-alert: false
          fail-on-alert: false

  notify:
    name: 'Notify on nightly regression'
    if: ${{ always() && github.event_name == 'schedule' && github.repository == 'rotki/rotki' }}
    needs: [ bench-nightly, micro-nightly, publish ]
    runs-on: ubuntu-latest
    environment: nightly_notify
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download benchmark artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: benchmark-artifacts
          merge-multiple: false

      - name: Collect benchmark regression alerts
        id: benchmark-alerts
        run: |
          find benchmark-artifacts -name bench-alert.md -size +0 -print | sort | while read -r file; do
            cat "$file" >> benchmark-alerts.md
            printf '\n' >> benchmark-alerts.md
          done
          if [ -s benchmark-alerts.md ]; then
            echo "has_alerts=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_alerts=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify if a benchmark regression was detected
        if: steps.benchmark-alerts.outputs.has_alerts == 'true'
        # Keep the webhook quoted so shell-special URL chars are preserved.
        run: |
          ./.github/scripts/notifier.py \
            --webhook "$DISCORD_WEBHOOK" \
            --run-id "$GITHUB_RUN_ID" \
            --test \
            --message-title 'benchmark regressions detected' \
            --message-file benchmark-alerts.md
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

      - name: Notify if a benchmark job failed
        if: needs.bench-nightly.result == 'failure' || needs.micro-nightly.result == 'failure' || needs.publish.result == 'failure'
        run: |
          ./.github/scripts/notifier.py --webhook "$DISCORD_WEBHOOK" --run-id "$GITHUB_RUN_ID" --test
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
