name: Cassette Merge

# Merges the test-caching cassettes of the PR that a push to a base branch merged. It runs on push
# rather than on the PR closing because it needs MERGE_TOKEN, which a fork PR's run never gets.
on:
  push:
    branches:
      - develop
      - bugfixes
      - master

permissions: { }

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  find-pr:
    name: 'Find the merged PR'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.repository == 'rotki/rotki' }}
    permissions:
      contents: read  # read the pushed commit
      pull-requests: read  # list the PRs that merged it
    outputs:
      number: ${{ steps.pr.outputs.number }}
    steps:
      - name: Find the merged PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          find_pr() {
            gh api "repos/$GH_REPO/commits/$SHA/pulls" \
              --jq "[.[] | select(.merged_at != null and .base.ref == \"$BRANCH\")][0].number // empty"
          }
          number=$(find_pr)
          # Right after a merge the commit may not be linked to its PR yet.
          if [ -z "$number" ]; then
            sleep 10
            number=$(find_pr)
          fi
          if [ -z "$number" ]; then
            echo "No PR merged into $BRANCH by $SHA"
            exit 0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

  merge:
    name: 'Merge the PR cassettes'
    needs: [ find-pr ]
    if: ${{ needs.find-pr.outputs.number != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cassette-merge
    permissions: { }
    steps:
      - name: Merge the cassettes
        uses: rotki/action-cassette-deck@5c276c9ba29fa32f3bc3673b2ff3086d0e85f5fa  # v4.2.0
        with:
          token: ${{ secrets.MERGE_TOKEN }}
          cassette_repo: test-caching
          pr_number: ${{ needs.find-pr.outputs.number }}
