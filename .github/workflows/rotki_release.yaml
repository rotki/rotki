name: Rotki Release
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_MACOS: 11
  CYPRESS_INSTALL_BINARY: 0

permissions: { }

jobs:
  create_draft:
    name: Create Draft
    runs-on: ubuntu-latest
    timeout-minutes: 15  # observed max 24s
    permissions:
      contents: write  # create the draft release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Get Release Version
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> "$GITHUB_ENV"

      - name: Generate changelog
        id: change_log
        run: |
          version=$(echo "$RELEASE_VERSION" | sed 's/^v//g')
          echo 'changes<<EOF' >> "$GITHUB_OUTPUT"
          python3 tools/scripts/generate_changelog.py -f docs/changelog.rst -v "$version" >> "$GITHUB_OUTPUT"
          echo 'EOF' >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        env:
          CHANGES: ${{ steps.change_log.outputs.changes }}
          VERSION: ${{ steps.change_log.outputs.version }}
        run: |
          # The changelog goes through env and a file, never into the script text.
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          # Description

          For more information check the detailed changelog below :point_down:

          # Downloads

          Upgrade is highly recommended. Download the binary for your OS from below:

          - **Linux**
            - [AppImage](https://github.com/rotki/rotki/releases/download/${RELEASE_VERSION}/rotki-linux_x86_64-${RELEASE_VERSION}.AppImage)
            - [Tar with executable](https://github.com/rotki/rotki/releases/download/${RELEASE_VERSION}/rotki-linux_x64-${RELEASE_VERSION}.tar.xz)
            - [deb package](https://github.com/rotki/rotki/releases/download/${RELEASE_VERSION}/rotki-linux_amd64-${RELEASE_VERSION}.deb)
            - [Standalone Backend](https://github.com/rotki/rotki/releases/download/${RELEASE_VERSION}/rotki-core-${VERSION}-linux.zip)
          - **OSX**
            - arm64
              - [DMG](https://github.com/rotki/rotki/releases/download/${RELEASE_VERSION}/rotki-darwin_arm64-${RELEASE_VERSION}.dmg)
              - [ZIP](https://github.com/rotki/rotki/releases/download/${RELEASE_VERSION}/rotki-darwin_arm64-${RELEASE_VERSION}.zip)
            - x86_64
              - [DMG](https://github.com/rotki/rotki/releases/download/${RELEASE_VERSION}/rotki-darwin_x64-${RELEASE_VERSION}.dmg)
              - [ZIP](https://github.com/rotki/rotki/releases/download/${RELEASE_VERSION}/rotki-darwin_x64-${RELEASE_VERSION}.zip)
            - Standalone Backend
              - [arm64](https://github.com/rotki/rotki/releases/download/${RELEASE_VERSION}/rotki-core-${VERSION}-macos-arm64.zip)
              - [x86_64](https://github.com/rotki/rotki/releases/download/${RELEASE_VERSION}/rotki-core-${VERSION}-macos-x64.zip)
          - **Windows**
            - [Windows executable](https://github.com/rotki/rotki/releases/download/${RELEASE_VERSION}/rotki-win32_x64-${RELEASE_VERSION}.exe)
            - [Standalone Backend](https://github.com/rotki/rotki/releases/download/${RELEASE_VERSION}/rotki-core-${VERSION}-windows.zip)

          Optionally, you can also [verify the integrity](https://docs.rotki.com/requirement-and-installation/packaged-binaries.html#verifying-integrity) of the aforementioned binaries using the following checksums:

          - **Linux**
            - [AppImage checksum](https://github.com/rotki/rotki/releases/download/${RELEASE_VERSION}/rotki-linux_x86_64-${RELEASE_VERSION}.AppImage.sha512)
            - [Tar with executable checksum](https://github.com/rotki/rotki/releases/download/${RELEASE_VERSION}/rotki-linux_x64-${RELEASE_VERSION}.tar.xz.sha512)
            - [deb package checksum](https://github.com/rotki/rotki/releases/download/${RELEASE_VERSION}/rotki-linux_amd64-${RELEASE_VERSION}.deb.sha512)
            - [Standalone Backend](https://github.com/rotki/rotki/releases/download/${RELEASE_VERSION}/rotki-core-${VERSION}-linux.zip.sha512)
          - **OSX**
            - arm64
              - [DMG checksum](https://github.com/rotki/rotki/releases/download/${RELEASE_VERSION}/rotki-darwin_arm64-${RELEASE_VERSION}.dmg.sha512)
              - [ZIP checksum](https://github.com/rotki/rotki/releases/download/${RELEASE_VERSION}/rotki-darwin_arm64-${RELEASE_VERSION}.zip.sha512)
            - x86_64
              - [DMG checksum](https://github.com/rotki/rotki/releases/download/${RELEASE_VERSION}/rotki-darwin_x64-${RELEASE_VERSION}.dmg.sha512)
              - [ZIP checksum](https://github.com/rotki/rotki/releases/download/${RELEASE_VERSION}/rotki-darwin_x64-${RELEASE_VERSION}.zip.sha512)
            - Standalone Backend
              - [arm64 checksum](https://github.com/rotki/rotki/releases/download/${RELEASE_VERSION}/rotki-core-${VERSION}-macos-arm64.zip.sha512)
              - [x86_64 checksum](https://github.com/rotki/rotki/releases/download/${RELEASE_VERSION}/rotki-core-${VERSION}-macos-x64.zip.sha512)
          - **Windows**
            - [Windows executable checksum](https://github.com/rotki/rotki/releases/download/${RELEASE_VERSION}/rotki-win32_x64-${RELEASE_VERSION}.exe.sha512)
            - [Standalone Backend](https://github.com/rotki/rotki/releases/download/${RELEASE_VERSION}/rotki-core-${VERSION}-windows.zip.sha512)

          # Release Highlights
          ----

          These were the highlights. Check below for the full changelog :point_down:

          ${CHANGES}

          # Newly supported assets

          Added support for the following assets:

          EOF

      # Edit instead of create on a retag: a draft-only `gh release create` skips
      # its duplicate check and would leave two drafts for the same tag.
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if lookup=$(gh release view "$RELEASE_VERSION" --json id 2>&1); then
            # --tag is resent on purpose: a draft edited without tag_name can lose its tag.
            gh release edit "$RELEASE_VERSION" --tag "$RELEASE_VERSION" \
              --title "Rotki $RELEASE_VERSION -" --notes-file "$RUNNER_TEMP/notes.md"
          elif [[ $lookup == *"release not found"* ]]; then
            gh release create "$RELEASE_VERSION" --draft --verify-tag \
              --title "Rotki $RELEASE_VERSION -" --notes-file "$RUNNER_TEMP/notes.md"
          else
            echo "$lookup" >&2
            exit 1
          fi

  linux:
    name: 'Build linux binary'
    env:
      CI: true
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30  # observed max 14m
    needs: create_draft
    permissions:
      id-token: write  # sign the build provenance attestation
      attestations: write  # store the attestation
      contents: write  # upload the binaries to the draft release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Load env
        uses: rotki/action-env@45dbd98dd8cfb0213b1a6dbefe37710bddf78679  # v4.0.2
        with:
          env_file: .github/.env.ci

      # Installs the version rust-toolchain.toml pins, the one CI lints and tests with.
      - name: Setup Rust
        run: rustup toolchain install --no-self-update

      - name: Get Release Version
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> "$GITHUB_ENV"

      - name: Set up python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          freethreaded: true

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
          version: ${{ env.UV_VERSION }}
          cache-dependency-glob: "uv.lock"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          package_json_file: frontend/package.json

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: 'frontend/.nvmrc'
          package-manager-cache: false

      - name: Package
        id: packaging
        run: |
          echo "::group::packaging dependencies"
          pip3 install --upgrade uv=="${UV_VERSION}"
          uv sync --locked --no-dev --group packaging
          echo "::endgroup::"
          uv run --no-sync ./package.py --build full

      - name: Upload to release
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s failglob
          gh release upload "$GITHUB_REF_NAME" --clobber dist/*.sha512 dist/rotki-core-*-linux.zip

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/rotki-core-*-linux.zip
            dist/*.deb
            dist/*.AppImage
            dist/*.tar.xz
  

  macos:
    name: 'Build macOS binary ${{ matrix.os.arch }}'
    strategy:
      fail-fast: false
      matrix:
        os:
          - runner: macos-15
            arch: 'arm64'
            target: 11
            platform: macosx-11.0-arm64
            uv-platform: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: 'x86_64'
            target: 11
            platform: macosx-11.0-x86_64
            uv-platform: x86_64-apple-darwin
    env:
      CI: true
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ARCHFLAGS: -arch ${{ matrix.os.arch }}
      _PYTHON_HOST_PLATFORM: ${{ matrix.os.platform }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.os.target }}
      # uv otherwise picks wheels for the runner's macOS, e.g. a numpy that needs macOS 14
      UV_TARGET_PLATFORM: ${{ matrix.os.uv-platform }}
      # pyyaml builds from source and would link Homebrew's libyaml, built for the runner's macOS
      PYYAML_FORCE_LIBYAML: 0
      CMAKE_OSX_ARCHITECTURES: ${{ matrix.os.arch }}
      NODE_OPTIONS: --max-old-space-size=4096
    environment: macos_sign
    runs-on: ${{ matrix.os.runner }}
    # observed max: arm64 34m, x86_64 58m, over a 26-58m spread. Release builds
    # deliberately run without the dependency cache, and the whole gap against
    # the nightly build lands inside the Package step. Signing waits on Apple
    # services on top of that, so keep the headroom generous.
    timeout-minutes: 120
    needs: create_draft
    permissions:
      id-token: write  # sign the build provenance attestation
      attestations: write  # store the attestation
      contents: write  # upload the binaries to the draft release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Load env
        uses: rotki/action-env@45dbd98dd8cfb0213b1a6dbefe37710bddf78679  # v4.0.2
        with:
          env_file: .github/.env.ci

      # Installs the version rust-toolchain.toml pins, the one CI lints and tests with.
      - name: Setup Rust
        run: rustup toolchain install --no-self-update

      - name: Add rust target for building deps
        if: ${{ matrix.os.arch == 'arm64' }}
        run: rustup target add aarch64-apple-darwin

      - name: Cache python pkg  # zizmor: ignore[cache-poisoning] setup-macos-python.sh checks the pkg's SHA-256 before installing
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/python*.pkg
          key: ${{ runner.os }}-python-${{ env.PYTHON_VERSION }}-${{ env.PYTHON_MACOS }}

      - name: Set up python
        run: packaging/setup-macos-python.sh "${PYTHON_VERSION}" "${PYTHON_MACOS}"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
          version: ${{ env.UV_VERSION }}
          cache-dependency-glob: "uv.lock"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          package_json_file: frontend/package.json

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: 'frontend/.nvmrc'
          package-manager-cache: false

      - name: Package
        id: packaging
        run: |
          echo "::group::packaging dependencies"
          uv sync --locked --no-dev --group packaging --python-platform "${UV_TARGET_PLATFORM}"
          echo "::endgroup::"
          uv run --no-sync ./package.py --build full
        env:
          CERTIFICATE_OSX_APPLICATION: ${{ secrets.CERTIFICATE_OSX_APPLICATION }}
          CSC_KEY_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.IDENTITY }}
          APPLEID: ${{ secrets.APPLEID }}
          APPLEIDPASS: ${{ secrets.APPLEIDPASS }}

      - name: Append architecture to latest-mac.yml
        env:
          ARCH: ${{ matrix.os.arch }}
        run: mv dist/latest-mac.yml "dist/latest-mac-${ARCH}.yml"

      - name: upload latest-mac.yml
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: latest-mac-${{ matrix.os.arch }}
          path: dist/latest-mac-*.yml

      - name: Upload to release
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s failglob
          gh release upload "$GITHUB_REF_NAME" --clobber dist/*.sha512 dist/rotki-core-*-macos-*.zip

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.dmg

  macos_updater:
    name: Merge latest-mac.yml
    needs: macos
    runs-on: ubuntu-latest
    timeout-minutes: 15  # observed max 42s
    permissions:
      contents: write  # replace latest-mac.yml on the draft release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          package_json_file: .github/scripts/package.json

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: 'frontend/.nvmrc'
          package-manager-cache: false

      - name: download latest-mac.yml artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: latest-mac
          pattern: latest-mac-*
          merge-multiple: true

      - name: Merge latest-mac.yml
        run: |
          pnpm install --dir ./.github/scripts --frozen-lockfile
          node ./.github/scripts/merge-latest.mjs latest-mac/latest-mac-x86_64.yml latest-mac/latest-mac-arm64.yml latest-mac.yml

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" --clobber latest-mac.yml

  windows:
    name: 'Build windows binary'
    env:
      CI: true
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: windows-latest
    timeout-minutes: 60  # observed max 33m; signing waits on a timestamp server
    environment: windows_sign
    needs: create_draft
    permissions:
      id-token: write  # sign the build provenance attestation
      attestations: write  # store the attestation
      contents: write  # upload the binaries to the draft release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Load env
        uses: rotki/action-env@45dbd98dd8cfb0213b1a6dbefe37710bddf78679  # v4.0.2
        with:
          env_file: .github/.env.ci

      # Installs the version rust-toolchain.toml pins, the one CI lints and tests with.
      - name: Setup Rust
        run: rustup toolchain install --no-self-update

      - name: Get Release Version
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> "$GITHUB_ENV"

      - name: Set up python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          freethreaded: true

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
          version: ${{ env.UV_VERSION }}
          cache-dependency-glob: "uv.lock"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          package_json_file: frontend/package.json

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: 'frontend/.nvmrc'
          package-manager-cache: false

      - name: Build rotki
        id: packaging
        run: |
          echo ::group::"packaging dependencies"
          uv sync --locked --no-dev --group packaging
          echo ::endgroup::
          uv run --no-sync .\package.py --build full
        shell: powershell

      - name: Upload to release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s failglob
          gh release upload "$GITHUB_REF_NAME" --clobber dist/*.sha512 dist/rotki-core-*-windows.zip

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/*.exe
            dist/rotki-core-*-windows.zip

  verify_assets:
    name: Verify release assets
    needs: [linux, macos, macos_updater, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # draft releases are only visible to tokens with push access
    steps:
      - name: Check that every expected asset is on the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          expected=(
            latest.yml
            latest-linux.yml
            latest-mac.yml
            "rotki-linux_x86_64-${tag}.AppImage" "rotki-linux_x86_64-${tag}.AppImage.sha512"
            "rotki-linux_x64-${tag}.tar.xz" "rotki-linux_x64-${tag}.tar.xz.sha512"
            "rotki-linux_amd64-${tag}.deb" "rotki-linux_amd64-${tag}.deb.sha512"
            "rotki-win32_x64-${tag}.exe" "rotki-win32_x64-${tag}.exe.sha512" "rotki-win32_x64-${tag}.exe.blockmap"
          )
          for arch in arm64 x64; do
            for ext in dmg zip; do
              base="rotki-darwin_${arch}-${tag}.${ext}"
              expected+=("$base" "$base.sha512" "$base.blockmap")
            done
          done
          for platform in linux macos-arm64 macos-x64 windows; do
            expected+=("rotki-core-${version}-${platform}.zip" "rotki-core-${version}-${platform}.zip.sha512")
          done

          assets=$(gh release view "$tag" --json assets --jq '.assets[] | "\(.name) \(.state) \(.size)"')
          failed=0
          for name in "${expected[@]}"; do
            found=$(awk -v n="$name" '$1 == n' <<< "$assets")
            if [[ -z $found ]]; then
              echo "::error::missing asset: $name"
              failed=1
            elif [[ $found != "$name uploaded "* || $found == "$name uploaded 0" ]]; then
              echo "::error::incomplete asset: $found"
              failed=1
            fi
          done
          echo "checked ${#expected[@]} expected assets against $(wc -l <<< "$assets") on the draft"
          exit "$failed"

  docker:
    name: 'Build docker images'
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30  # observed max 8m warm; extra air for a cold build cache
    environment: docker
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux/amd64
            runner: ubuntu-24.04
          - name: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare
        id: prepare
        env:
          platform: ${{ matrix.platform.name }}
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: |
            ${{ github.repository }}

      - name: Login to DockerHub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Rotki Version
        id: rotki_version
        run: echo "version=${GITHUB_REF#refs/*/}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: docker_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform.name }}
          provenance: mode=max
          sbom: true
          tags: ${{ github.repository }}
          build-args: |
            REVISION=${{ github.sha }}
            ROTKI_VERSION=${{ steps.rotki_version.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ github.repository }}",push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          TEMP: ${{ runner.temp }}
          DIGEST: ${{ steps.docker_build.outputs.digest }}
        run: |
          mkdir -p "${TEMP}/digests"
          digest="${DIGEST}"
          touch "${TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    name: 'Merge the Docker platform images'
    runs-on: ubuntu-latest
    timeout-minutes: 15  # observed max 30s
    needs:
      - docker
    environment: docker
    permissions:
      contents: read
      id-token: write  # sign the image provenance attestation
      attestations: write  # store the attestation
      artifact-metadata: write  # record the image digest as an artifact
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: |
            ${{ github.repository }}
          flavor: |
            latest=false
            prefix=v,onlatest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REPOSITORY}@sha256:%s " *)

      - name: Inspect image
        id: inspect
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "${REPOSITORY}:${VERSION}"
          digest=$(docker buildx imagetools inspect "${REPOSITORY}:${VERSION}" --format '{{json .Manifest}}' | jq -er '.digest')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # push-to-registry stores the attestation next to the image as an OCI
      # referrer, so it is reachable with cosign and not only through GitHub's
      # attestation API. Runs last: the image is already published at this point,
      # so a referrers hiccup fails the job without leaving a half-pushed tag.
      - name: Attest the merged manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: docker.io/${{ github.repository }}
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: true
