name: Frontend Unit Tests

on:
  workflow_call:

permissions: { }

jobs:
  unit:
    name: 'vitest'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # authenticate the Codecov upload with OIDC
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Load env
        uses: rotki/action-env@39fabde543b2b2f163b8ecce6570473bccc4e2c1  # v4.0.1
        with:
          env_file: .github/.env.ci

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
        with:
          package_json_file: frontend/package.json

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: 'frontend/.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        working-directory: ./frontend/app
        run: pnpm run --filter rotki test:unit

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: ./frontend/app/tests/unit/coverage/lcov.info
          flags: frontend_unit
          # A fork PR gets no OIDC token; Codecov accepts its upload without one.
          use_oidc: ${{ !github.event.pull_request.head.repo.fork }}