name: Frontend Unit Tests

on:
  workflow_call:

permissions: { }

jobs:
  unit:
    name: 'vitest'
    runs-on: ubuntu-latest
    timeout-minutes: 20  # observed max 10m
    permissions:
      contents: read
      id-token: write  # authenticate the Codecov upload with OIDC
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Load env
        uses: rotki/action-env@49f59e650cfdc8796c4ac6533ec044b190d83f9a  # v4.0.0
        with:
          env_file: .github/.env.ci

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          package_json_file: frontend/package.json

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: 'frontend/.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        working-directory: ./frontend/app
        run: pnpm run --filter rotki test:unit

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: ./frontend/app/tests/unit/coverage/lcov.info
          # The action otherwise also uploads every coverage-looking file it finds.
          disable_search: true
          flags: frontend_unit
          # A fork PR gets no OIDC token; Codecov accepts its upload without one.
          use_oidc: ${{ !github.event.pull_request.head.repo.fork }}