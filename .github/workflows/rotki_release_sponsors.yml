name: Update Release Sponsors

on:
  release:
    types: [ published, edited ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published minor release tag (for example, v1.44.0)'
        required: true
        type: string

concurrency:
  group: release-sponsors-${{ github.repository }}
  cancel-in-progress: false

permissions: { }

jobs:
  update:
    name: 'Update the release sponsors'
    if: >-
      github.repository == 'rotki/rotki' &&
      (github.event_name == 'workflow_dispatch' ||
       (!github.event.release.draft && !github.event.release.prerelease))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Select minor release
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.0$ ]]; then
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            echo "minor=true" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            echo 'Expected a minor release tag such as v1.44.0' >&2
            exit 1
          else
            echo 'Skipping a non-minor release'
          fi

      - name: Checkout develop
        if: steps.release.outputs.minor == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: develop
          persist-credentials: false

      - name: Fetch release and update sponsors
        if: steps.release.outputs.minor == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          gh release view "$RELEASE_TAG" --json tagName,body,isDraft,isPrerelease > "$RUNNER_TEMP/release.json"
          args=(--release-json "$RUNNER_TEMP/release.json")
          if [[ "$EVENT_ACTION" == edited ]]; then
            args+=(--skip-without-sponsors)
          fi
          python3 tools/scripts/update_release_sponsors.py "${args[@]}"
          git diff --check

      - name: Create app token
        if: steps.release.outputs.minor == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_SPONSORS_APP_ID }}
          private-key: ${{ secrets.RELEASE_SPONSORS_APP_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update pull request
        if: steps.release.outputs.minor == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          branch="automation/release-sponsors/$RELEASE_TAG"
          if git diff --quiet -- releases_sponsors.md; then
            echo "releases_sponsors.md already matches develop"
            # A branch left from an earlier run no longer differs from develop: deleting it closes its PR.
            if gh api "repos/$GH_REPO/branches/$branch" --silent 2>/dev/null; then
              gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$branch"
            fi
            exit 0
          fi

          gh auth setup-git
          git switch -c "$branch"
          git add releases_sponsors.md
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --author="$ACTOR <$ACTOR_ID+$ACTOR@users.noreply.github.com>" \
            -m "Update sponsors for $RELEASE_TAG"
          git push --force "https://github.com/$GH_REPO.git" "HEAD:refs/heads/$branch"

          title="Update sponsors for $RELEASE_TAG"
          printf '%s\n' \
            "Update \`releases_sponsors.md\` from the sponsor section of" \
            "https://github.com/$GH_REPO/releases/tag/$RELEASE_TAG." \
            '' \
            'Keeps sponsor tiers and details as published and releases ordered newest first.' \
            > "$RUNNER_TEMP/pr-body.md"
          number=$(gh pr list --head "$branch" --base develop --state open --json number --jq '.[0].number // empty')
          if [[ -n "$number" ]]; then
            gh pr edit "$number" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create --base develop --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"
          fi
