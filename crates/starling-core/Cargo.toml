[package]
name = "starling-core"
version.workspace = true
description = "Lifecycle core for the rotki starling supervisor: declarative service graph, readiness gating, and platform process termination."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
tokio.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
dirs.workspace = true

[dev-dependencies]
# Test-only: exercise the control-protocol wire shapes. The library itself
# serializes via serde derive only; the JSON format lives in the binary.
serde_json.workspace = true
# `test-util` for `#[tokio::test(start_paused = true)]`: lets the shutdown-budget
# tests assert against a virtual clock instead of a flaky wall-clock margin.
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.30.1", features = ["signal", "process", "user"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.58.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# Test-only helper binary exercised by tests/process_tree.rs via
# `env!("CARGO_BIN_EXE_fake_bootloader")`. Kept tiny and dependency-free so it
# doesn't bloat the library compile.
[[bin]]
name = "fake_bootloader"
path = "tests/support/fake_bootloader.rs"
test = false
bench = false
doc = false
