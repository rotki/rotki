[package]
name = "starling-proxy"
version.workspace = true
description = "In-process HTTP server and reverse proxy that serves the rotki SPA and fronts the backend services (replaces nginx in the Docker image)."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
tokio.workspace = true
tracing.workspace = true

# Body combinators: the access log wraps the response body to count the bytes
# actually written, which Content-Length cannot give us once compression makes
# the response chunked.
http-body-util = "=0.1.5"

# In-process HTTP server + reverse proxy, replaces nginx.
axum.workspace = true
# `util` for `ServiceExt::oneshot`: the hyper accept loop drives the axum router
# per connection, so it needs to call the router as a one-shot service.
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = [
    "fs",
    "compression-gzip",
    "compression-br",
    "trace",
    "limit",
    "set-header",
    "timeout",
] }
hyper = { version = "=1.12.0", features = ["http1", "client", "server"] }
hyper-util = { version = "=0.1.21", features = [
    "client",
    "client-legacy",
    "http1",
    "tokio",
] }
# Binding `::` dual-stack needs IPV6_V6ONLY cleared before bind, which tokio's
# TcpSocket does not expose.
socket2 = "=0.6.5"

[dev-dependencies]
serde_json.workspace = true
tower = { workspace = true, features = ["util"] }
tokio-tungstenite = "=0.30.0"
futures-util = "=0.3.34"
