[package]
name = "starling"
version.workspace = true
description = "Cross-platform supervisor that owns the lifecycle of the rotki backend services (rotki-core + colibri)."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "starling"
path = "src/main.rs"

[dependencies]
starling-core = { path = "../starling-core" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
clap = { workspace = true, features = ["derive"] }
serde.workspace = true
serde_json.workspace = true

# Cross-platform advisory file locking for the single-instance data-directory
# guard (flock / LockFileEx). Held for the supervised lifetime; OS-released on exit.
fs4 = { version = "=0.13.1", features = ["sync"] }

# The in-process HTTP server + reverse proxy served in docker mode (replaces
# nginx). Lives in its own crate: it takes a config and serves, knowing nothing
# about the supervisor or service state.
starling-proxy = { path = "../starling-proxy" }

# OS CSPRNG for minting the per-launch backend secret and the renderer secret.
getrandom = "=0.2.17"

[target.'cfg(unix)'.dependencies]
# PID-1 orphan reaping (waitid/waitpid), privilege separation (setuid/setgid/
# setgroups/geteuid via "user"), and volume chown ("fs") in docker mode.
nix = { version = "=0.30.1", features = ["process", "signal", "user", "fs"] }
