allowUnusedPatches: true
blockExoticSubdeps: true

minimumReleaseAge: 10080
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@rotki/ui-library'
  - '@rotki/eslint-config'
  - '@rotki/eslint-plugin'
  - plainfp

trustPolicy: no-downgrade
trustPolicyExclude:
  - 'semver@5.7.2 || 6.3.1'
  - undici-types@6.19.8
  - '@noble/curves@1.8.0'
  - '@noble/hashes@1.7.0'
  - slow-redact@0.3.2

shamefullyHoist: true
shellEmulator: true
strictDepBuilds: true
saveExact: true

packages:
  - app
  - common
  - dev-proxy
  - 'eslint/*'

overrides:
  chokidar: 5.0.0
  tinypool: 2.2.0
  ws: 8.22.0

patchedDependencies:
  app-builder-lib: patches/app-builder-lib.patch
  bignumber.js@11.1.5: patches/bignumber.js@11.1.5.patch

allowBuilds:
  '@parcel/watcher': true
  bufferutil: true
  core-js-pure: false
  electron: true
  electron-winstaller: true
  esbuild: true
  keccak: true
  msw: false
  utf-8-validate: true
  vue-demi: true

