[build-system]
requires = ["setuptools==83.0.0", "setuptools-scm==7.1.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "rotkehlchen"
authors = [
    {name = "Rotki Solutions GmbH", email = "info@rotki.com"},
]
description = "Accounting, asset management and tax report helper for cryptocurrencies"
readme = "README.md"
requires-python = "==3.14.*"
keywords = ["accounting tax-report", "portfolio asset-management", "cryptocurrencies"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Topic :: Utilities",
]
license = {file = "LICENSE.md"}
dynamic = ["version"]

dependencies = [
    "web3==7.16.0",
    "eth-account==0.13.7",
    "eth-typing==5.2.1",
    "content-hash==2.0.0",
    "sqlcipher3==0.6.2",
    "rotki-sqlite==2026.07.2",
    "requests==2.33.1",
    "bech32==1.2.0",
    "gql[requests]==3.5.2",
    "scalecodec==1.2.11",
    "py-sr25519-bindings==0.2.4",
    "py-ed25519-zebra-bindings==1.3.0",
    "py-bip39-bindings==0.3.0",
    "substrate-interface==1.8.1",
    "beautifulsoup4==4.14.2",
    "defusedxml==0.7.1",
    "maxminddb==3.1.1",
    "cryptography==48.0.1",
    "py-machineid==0.8.0",
    "more-itertools==10.6.0",  # for peekable iterators
    "regex==2025.11.3",  # used for unicode information in detection of spam tokens
    "eth-abi==5.2.0",
    "eth-utils==5.3.1",
    # For the rest api
    "flask-cors==6.0.1",
    "flask==3.1.3",
    "marshmallow==4.3.0",
    "webargs==8.7.1",
    "werkzeug==3.1.8",
    # the asyncio api server (uvicorn serving REST via the a2wsgi bridge + native /ws)
    "uvicorn==0.47.0",
    "a2wsgi==1.10.10",
    "websockets==15.0.1",  # uvicorn's websocket protocol backend (also a solana dep)
    # for fuzzy search of assets
    "polyleven==0.11",
    # We used to only use this for packaging, but now use it for the version comparison functionality
    "packaging==25.0",
    # For Google Calendar integration
    "google-api-python-client==2.192.0",
    "google-auth==2.49.1",
    # To build JWT for coinbase exchange key validation
    "PyJWT==2.13.0",
    "construct==2.10.68",
    "tzdata==2025.2 ; sys_platform == 'win32'",
    # enfore transitive deps versions
    "aiohttp==3.14.1",  # dependency of web3.py that has security issues before this version
    "urllib3==2.7.0",  # enforced due to dependabot reports
    "idna==3.18",  # enforced due to dependabot reports
    "cbor2==5.9.0",  # enforced due to dependabot reports
    "protobuf==6.33.6",  # enforced due to dependabot reports
    "xxhash==3.7.2",  # enforced for free-threaded Python support
    "bitarray==3.8.2",  # pinned to check free-threaded Python support
    "pandas==3.0.3",
    "mcp==1.28.1",
]

[project.urls]
homepage = "https://rotki.com"
documentation = "https://docs.rotki.com"
repository = "https://github.com/rotki/rotki"
changelog = "https://github.com/rotki/rotki/blob/develop/docs/changelog.rst"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-icdiff==0.9",
    "pytest-xdist==3.8.0",
    "bump2version==1.0.1",
    "pytest-cov==7.0.0",
    "coverage==7.13.0",
    "psutil==7.1.3",
    "pytest-freezer==0.4.9",
    "pytest-deadfixtures @ git+https://github.com/rotki/pytest-deadfixtures@87d2be8#egg=pytest-deadfixtures", # temporarily due to false positive
    "pytest-socket==0.7.0",
    "pytest-vcr==1.0.2",
    "vcrpy==8.2.1",
    "freezegun==1.5.5",
    # To test google spreadsheet uploading
    "google-auth-httplib2==0.2.0",
    "google-api-core==2.24.2",
    "google-auth-oauthlib==1.2.1",
    "pytest-benchmark==5.2.3",
]

lint = [
    "mypy==2.1.0",
    "mypy-extensions==1.1.0",
    "pylint==4.0.6",
    "astroid==4.0.2",  # engine of pylint, upgrade them together
    "ruff==0.16.1",
    "double-indent-rotki==0.1.7",  # our fork of double indent
    "pyright==1.1.411",
    # type packages used by mypy
    # pinned here so that we can have reproducible mypy runs
    "types-chardet==5.0.4.6",
    "types-cryptography==3.3.23.2",
    "types-enum34==1.1.8",
    "types-ipaddress==1.0.8",
    "types-setuptools==80.9.0.20250822",
    "types-requests==2.32.4.20250913",
    "types-urllib3==1.26.25.14",
    "types-toml==0.10.8.20240310",
    "types-python-dateutil==2.9.0.20250822",
]

docs = [
    # sphinxcontrib-httpexample imports pkg_resources, which no longer comes
    # with the venv by default (gevent's zope deps used to pull setuptools in)
    "setuptools==83.0.0",
    "sphinx==8.2.3",
    "sphinx-autobuild==2025.8.25",
    "sphinx_inline_tabs==2025.12.21.14",
    "sphinx_rtd_theme==3.1.0",
    "sphinxcontrib-httpdomain==2.0.0",
    "sphinxcontrib-httpexample==2.0",
    # This is our fork of releases in order to handle https://github.com/rotki/rotki/issues/704
    "rotki-releases==2.0.1",
]

packaging = [
    "setuptools==83.0.0",
    "setuptools-scm==7.1.0",
    "wheel==0.46.2",
]

crossbuild = [
    # dependencies that need to be installed manually when creating arm and x86 packages for macos using
    # the x86 as base architecture for both
    "ckzg==2.1.7",
]

profiling = [
    "objgraph==3.5.0",
]

ci = [
    "pytest-github-actions-annotate-failures==0.3.0",
]

[tool.setuptools.packages.find]
where = ["."]  # list of folders that contain the packages (["."] by default)
include = ["rotkehlchen*", "rsqlite", "cytoolz"]

[project.scripts]
rotkehlchen = "rotkehlchen.__main__:main"
rotkehlchen_mock = "rotkehlchen_mock.__main__:main"

# Dependencies are now managed by uv
# [tool.setuptools.dynamic]
# dependencies = {file = ["requirements.txt"]}

[tool.setuptools_scm]
fallback_version = "1.43.2"

[tool.setuptools.package-data]
"rotkehlchen.data" = ["*"]
"rotkehlchen.chain" = ["ethereum/modules/dxdaomesa/data/contracts.json"]

# -- Mypy config section --

[tool.mypy]
# Docs: https://mypy.readthedocs.io/en/latest/config_file.html
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_configs = true
warn_unused_ignores = true
warn_unreachable = true
warn_redundant_casts = true
disallow_untyped_decorators = true
disallow_untyped_calls = true
mypy_path="./stubs/"

[[tool.mypy.overrides]]
module = "rotkehlchen.*"
ignore_missing_imports = false

# -- These modules still need to have proper type definitions given --
[[tool.mypy.overrides]]
module = "rotkehlchen.tests.*"
# Pytest's fixture decorators are not typed
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "rotkehlchen.tests.fixtures.google"
ignore_errors = true  # since this is seen differently locally with requirements dev and differently in the CI with only requirements lint

# custom pylint checkers still need to be typed
[[tool.mypy.overrides]]
module = "tools.pylint.*"
check_untyped_defs = false
disallow_untyped_defs = false

# profiling is not typed
[[tool.mypy.overrides]]
module = "tools.profiling.*"
check_untyped_defs = false
disallow_untyped_defs = false

# -- ruff config section --

[tool.ruff]
line-length = 99

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]
target-version = "py314"

[tool.ruff.lint]
preview = true  # https://docs.astral.sh/ruff/preview/
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

select = [
    "E",
    "F",
    "W",
    "C",
    "I",  # isort
    # "D",  # pydocstyle -- too many docstuff we don't use
    "N",
    "B",
    "C4",
    "T10",
    "EXE",
    "G",
    # "EM",  # our exceptions use f strings everywhere. Very little upside to this and I don't think it's cleaner code
    # "CPY",  # If we ever wanted to enforce copyright notice on each file
    "ISC",
    "ICN",
    "T",
    "UP",
    "YTT",
    "ASYNC",
    # "ANN",  # flake8-annotations -- looks like mypy already covers this?
    "S",
    # "BLE",  # blind-except -- already pylint does this and we got ignores where needed
    # "FBT",  # FBT -- not sure I agree with the concept of boolean trap
    "A",
    "Q",  # configured for our quoting style
    "ERA",
    "PGH",
    "RET",
    "SIM",
    "SLOT",
    "FA",
    #  "SLF",  # Private member access -- we unfortunately do that some times
    # "TD",  # this is just to detect todos
    # "FIX",  # this is just to detect todos
    "TID",  # tidy-imports -- includes TID251 banned-api, which keeps gevent from creeping back. See docs/designs/gevent_to_asyncio.md
    # "ARG",  # flake8-unused-arguments -- pylint already does this and we got ignores where needed
    "PL",  # all pylint rules
    "PIE",
    "PYI",
    "COM",
    "DTZ",
    "INP",
    "PT",
    "TC",
    "TCH",
    # "PTH",  # Should do it at some point. Many hits and no autofix. When enabled fully remove from extend-select
    "INT",
    "TRY",
    "FLY",
    "PERF",
    "FURB",
    "RSE",
    "LOG",
    "RUF",
]
extend-select = [
    "bad-quotes-docstring",   # Single quote docstring found but double quotes preferred
    "avoidable-escaped-quote",   # Change outer quotes to avoid escaping inner quotes
    # Some pathlib enforcement rules follow
    "os-unlink",
    "os-getcwd",
]
ignore = [
    "stdlib-module-shadowing",  # shadow builtin module is fine, since it's easy to differentiate and we can use names like csv.py, json.py, types.py under subdirectories
    "no-explicit-stacklevel",  # no explicit stack level argument for warnings. Is fine due to the way we use them for now
    "error-suffix-on-exception-name",  # error suffix in exception names
    "complex-structure",  # function too complex
    "collection-literal-concatenation",  # Unpacking over concatenation -> https://github.com/charliermarsh/ruff/issues/2054#issuecomment-1399617413
    "unnecessary-return-none",  # Explicitly returning None
    "superfluous-else-return",  # https://github.com/charliermarsh/ruff/issues/1035
    "superfluous-else-raise",  # https://github.com/charliermarsh/ruff/issues/1035
    "superfluous-else-continue",  # https://github.com/charliermarsh/ruff/issues/1035
    "superfluous-else-break",  # https://github.com/charliermarsh/ruff/issues/1035
    "blanket-type-ignore",  # we do use blanket type: ignore. Perhaps can fix in the future
    "if-else-block-instead-of-if-exp",  # we do use ternary operator when it makes sense. But forcing it everywhere makes the code unreadable.
    "magic-value-comparison", # we try to use constant vars where possible but this complains abouttoo many things
    "too-many-public-methods", # too many public methods. This is a bit too much to enforce in the codebase
    "too-many-arguments", # too many arguments to function call. This is a bit too much to enforce in the codebase
    "too-many-locals", # too many local variables. This is a bit too much to enforce in the codebase
    "too-many-statements", # too many statements -- we probably could use this ... but with custom statements number?
    "too-many-boolean-expressions", # too many boolean expressions -- we dont care
    "too-many-return-statements", # too many return statements -- we dont care
    "too-many-branches", # too many branches -- we dont care
    "too-many-positional-arguments", # too many positional arguments -- we dont care
    "too-many-nested-blocks", # too many nested blocks -- we dont care
    "literal-membership", # Doesn't work only for constants: https://github.com/astral-sh/ruff/issues/8322
    "no-self-use", # could be a staticmethod or function -- breaks for interfaces
    "import-outside-top-level", # we need to fix non top level imports and enable this
    "compare-to-empty-string", # we prefer direct comparison to empty string for explicitness
    "import-private-name", # unfortunately we do import private methods/vars from web3.py and webargs
    "unnecessary-dunder-call", # false positive complain for dunder set (though we use it in a hacky way)
    "too-many-statements-in-try-clause", # too many statements in try clause -- too strict for our error handling style
    # Some bandit rules we don't check for
    "assert",  # asserts are fine
    "bad-file-permissions",  # permissive mask on file/directory
    "hardcoded-password-string",  # hard coded password checks got false positives
    "hardcoded-password-func-arg",  # hard coded password checks got false positives
    "suspicious-non-cryptographic-random-usage",  # We know pseudo-random is not safe for cryptographic operations
    "hardcoded-sql-expression",  # possible sql-injection is overkill since we control the variables in question
    "logging-f-string",  # Our logs do use f-strings everywhere at least for now
    # Some pytest-styles rules we don't check for
    "pytest-raises-too-broad", # pytest.raises() too broad is fine, since there is functions that raise ValueError
    "pytest-composite-assertion", # composite assertions are fine
    "raise-vanilla-args",  # long messages outside the exception class. Perhaps enable when we do internationalization and need to put messages in class logic?
    "type-check-without-type-error",  # Prefer TypeError for wrong type. May be okay but would need to invetigate all usages of suggested changes
    "raise-within-try",  # Abstract raise to an inner function -- not sure what this? Use exception for control flow?
    "error-instead-of-exception",  # logging.exception instead of logging.error. Not sure I understood this one
    "float-equality-comparison",  # https://github.com/astral-sh/ruff/issues/23281
    "noqa-comments",  # rewrites every `# noqa: X` to `# ruff:ignore[X]`. Preview rule and the ruff:ignore syntax only became official in 0.16.0. Both forms behave identically so we keep noqa
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# gevent was removed (docs/designs/gevent_to_asyncio.md) and must not creep
# back: use stdlib threading/time primitives or rotkehlchen.concurrency.
"gevent".msg = "gevent was removed; use threading/time primitives or rotkehlchen.concurrency instead"
"geventwebsocket".msg = "geventwebsocket was removed; the uvicorn server serves /ws natively"

[tool.ruff.lint.flake8-quotes]
avoid-escape = true
docstring-quotes = "double"
inline-quotes = "single"
multiline-quotes = "double"

[tool.ruff.lint.isort]
combine-as-imports = true
known-third-party = ["packaging"]  # packaging is otherwise detected as first-party due to the ./packaging folder

[tool.ruff.lint.per-file-ignores]
"tools/*" = [
    "print",  # got prints in tools
    "implicit-namespace-package",  # no need for __init__ in tools
]
"rotkehlchen/__main__.py" = [
    "print",  # got prints in main
]
"rotkehlchen/api/server.py" = [
    "print",  # got prints in server.py
]
"rotkehlchen/args.py" = ["print"]  # got prints in args.py
"rotkehlchen/db/minimized_schema.py" = [
    "line-too-long",  # huge lines there
    "bad-quotes-inline-string",  # double quoted strings needed here
]
"rotkehlchen/globaldb/minimized_schema.py" = [
    "line-too-long",  # huge lines there
    "bad-quotes-inline-string",  # double quoted strings needed here
]
"rotkehlchen/tests/*" = [
    "request-without-timeout",    # tests have no timeout in requests
    "assignment-in-assert",  # We have assignments in assert in tests and that's fine there
]
"rotkehlchen/tests/conftest.py" = [
    "module-import-not-at-top-of-file",  # logging must be configured before importing the fixtures, which pull in modules that grab loggers
    "subprocess-popen-with-shell-equals-true",  # test setup. No problem with shell=True
    "start-process-with-a-shell",  # test setup, can't inject in process
    "start-process-with-partial-path",  # test setup, partial path does not matter
]
"rotkehlchen/tests/integration/test_backend.py" = [
    "subprocess-without-shell-equals-true",  # test called by us. No variable input
    "start-process-with-partial-path",  # test called by us. Partial executable path is fine.
]
"setup.py" = ["implicit-namespace-package"]  # no need for __init__ here
"package.py" = [
    "implicit-namespace-package",  # no need for __init__ here
    "subprocess-popen-with-shell-equals-true",  # script called by us only when packaging. No problem with shell=True
    "start-process-with-partial-path",  # script called by us only when packaging. No problem with partial path
]
"tools/bench/launch_backend.py" = [
    "module-import-not-at-top-of-file",  # requests and the protocol cache are patched before importing the app on purpose
]
"tools/scripts/pylint_useless_suppression.py" = [
    "subprocess-without-shell-equals-true",  # Script called by us. No variable input
    "start-process-with-partial-path",  # Script called by us. Partial executable path is fine.
]
"docs/conf.py" = [
    "commented-out-code",  # Lots of comments with text combined with commented-out example code
    "implicit-namespace-package",  # no need for __init__ here
]


[tool.vulture]

ignore_names = ["fixture_*", "*Accountant", "*Decoder"]
sort_by_size = true


[tool.pyright]

reportUndefinedVariable = "error"
reportGeneralTypeIssues = false
reportUnknownParameterType = false
reportMissingTypeStubs = false
reportMissingImports = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUntypedFunctionDecorator = false
reportUnknownArgumentType = false
reportMissingTypeArgument = false
reportInvalidTypeVarUse = false
reportCallInDefaultInitializer = false
reportAttributeAccessIssue = false
reportPrivateImportUsage = false
reportArgumentType = false
reportIncompatibleMethodOverride = false
reportOperatorIssue = "error"
reportIndexIssue = false
reportOptionalMemberAccess = false
reportCallIssue = false
reportOptionalSubscript = false
reportInvalidTypeForm = false
reportIncompatibleVariableOverride = false
reportReturnType = false
reportOverlappingOverload = false
reportTypedDictNotRequiredAccess = "error"
reportOptionalContextManager = false
reportAssignmentType = false
reportUnnecessaryComparison = true

exclude = ["**/tests"]
pythonVersion = "3.14"


[tool.pytest.ini_options]
# benchmarks (rotkehlchen/tests/benchmarks) are excluded from normal runs; run
# them with: pytest -m benchmark --benchmark-only rotkehlchen/tests/benchmarks
addopts = '-m "not benchmark"'
markers = [
    "accounting_update: tests for the experimental accounting update",
    "asset_test: tests that check for asset coverage and definitions",
    "vcr: tests that use vcrpy cassettes",
]


[tool.pylint.typecheck]
ignored-classes = "rsqlite"

[tool.uv]
exclude-newer = "1 week"
exclude-newer-package = { xxhash = "2026-07-07T00:00:00Z", rotki-sqlite = "2026-07-13T15:54:00Z" }
