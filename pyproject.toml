[build-system]
requires = ["setuptools==83.0.0", "setuptools-scm==7.1.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "rotkehlchen"
authors = [
    {name = "Rotki Solutions GmbH", email = "info@rotki.com"},
]
description = "Accounting, asset management and tax report helper for cryptocurrencies"
readme = "README.md"
requires-python = "==3.14.*"
keywords = ["accounting tax-report", "portfolio asset-management", "cryptocurrencies"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Topic :: Utilities",
]
license = {file = "LICENSE.md"}
dynamic = ["version"]

dependencies = [
    "web3==7.16.0",
    "eth-account==0.13.7",
    "eth-typing==5.2.1",
    "content-hash==2.0.0",
    "sqlcipher3==0.6.2",
    "rotki-sqlite==2026.07.2",
    "requests==2.33.1",
    "bech32==1.2.0",
    "gql[requests]==3.5.2",
    "scalecodec==1.2.11",
    "py-sr25519-bindings==0.2.4",
    "py-ed25519-zebra-bindings==1.3.0",
    "py-bip39-bindings==0.3.0",
    "substrate-interface==1.8.1",
    "beautifulsoup4==4.14.2",
    "defusedxml==0.7.1",
    "maxminddb==3.1.1",
    "cryptography==48.0.1",
    "py-machineid==0.8.0",
    "more-itertools==10.6.0",  # for peekable iterators
    "regex==2025.11.3",  # used for unicode information in detection of spam tokens
    "eth-abi==5.2.0",
    "eth-utils==5.3.1",
    # For the rest api
    "flask-cors==6.0.1",
    "flask==3.1.3",
    "marshmallow==4.3.0",
    "webargs==8.7.1",
    "werkzeug==3.1.8",
    # the asyncio api server (uvicorn serving REST via the a2wsgi bridge + native /ws)
    "uvicorn==0.47.0",
    "a2wsgi==1.10.10",
    "websockets==15.0.1",  # uvicorn's websocket protocol backend (also a solana dep)
    # for fuzzy search of assets
    "polyleven==0.11",
    # We used to only use this for packaging, but now use it for the version comparison functionality
    "packaging==25.0",
    # For Google Calendar integration
    "google-api-python-client==2.192.0",
    "google-auth==2.49.1",
    # To build JWT for coinbase exchange key validation
    "PyJWT==2.13.0",
    "construct==2.10.68",
    "tzdata==2025.2 ; sys_platform == 'win32'",
    # enfore transitive deps versions
    "aiohttp==3.14.1",  # dependency of web3.py that has security issues before this version
    "urllib3==2.7.0",  # enforced due to dependabot reports
    "idna==3.18",  # enforced due to dependabot reports
    "cbor2==5.9.0",  # enforced due to dependabot reports
    "protobuf==6.33.6",  # enforced due to dependabot reports
    "xxhash==3.7.2",  # enforced for free-threaded Python support
    "bitarray==3.8.2",  # pinned to check free-threaded Python support
    "pandas==3.0.3",
    "mcp==1.28.1",
]

[project.urls]
homepage = "https://rotki.com"
documentation = "https://docs.rotki.com"
repository = "https://github.com/rotki/rotki"
changelog = "https://github.com/rotki/rotki/blob/develop/docs/changelog.rst"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-icdiff==0.9",
    "pytest-xdist==3.8.0",
    "bump2version==1.0.1",
    "pytest-cov==7.0.0",
    "coverage==7.13.0",
    "psutil==7.1.3",
    "pytest-freezer==0.4.9",
    "pytest-deadfixtures @ git+https://github.com/rotki/pytest-deadfixtures@87d2be8#egg=pytest-deadfixtures", # temporarily due to false positive
    "pytest-socket==0.7.0",
    "pytest-vcr==1.0.2",
    "vcrpy==8.2.1",
    "freezegun==1.5.5",
    # To test google spreadsheet uploading
    "google-auth-httplib2==0.2.0",
    "google-api-core==2.24.2",
    "google-auth-oauthlib==1.2.1",
    "pytest-benchmark==5.2.3",
]

lint = [
    "mypy==2.1.0",
    "mypy-extensions==1.1.0",
    "pylint==4.0.6",
    "astroid==4.0.2",  # engine of pylint, upgrade them together
    "ruff==0.16.1",
    "double-indent-rotki==0.1.7",  # our fork of double indent
    "pyright==1.1.411",
    # type packages used by mypy
    # pinned here so that we can have reproducible mypy runs
    "types-chardet==5.0.4.6",
    "types-cryptography==3.3.23.2",
    "types-enum34==1.1.8",
    "types-ipaddress==1.0.8",
    "types-setuptools==80.9.0.20250822",
    "types-requests==2.32.4.20250913",
    "types-urllib3==1.26.25.14",
    "types-toml==0.10.8.20240310",
    "types-python-dateutil==2.9.0.20250822",
]

docs = [
    # sphinxcontrib-httpexample imports pkg_resources, which no longer comes
    # with the venv by default (gevent's zope deps used to pull setuptools in)
    "setuptools==83.0.0",
    "sphinx==8.2.3",
    "sphinx-autobuild==2025.8.25",
    "sphinx_inline_tabs==2025.12.21.14",
    "sphinx_rtd_theme==3.1.0",
    "sphinxcontrib-httpdomain==2.0.0",
    "sphinxcontrib-httpexample==2.0",
    # This is our fork of releases in order to handle https://github.com/rotki/rotki/issues/704
    "rotki-releases==2.0.1",
]

packaging = [
    "setuptools==83.0.0",
    "setuptools-scm==7.1.0",
    "wheel==0.46.2",
]

crossbuild = [
    # dependencies that need to be installed manually when creating arm and x86 packages for macos using
    # the x86 as base architecture for both
    "ckzg==2.1.7",
]

profiling = [
    "objgraph==3.5.0",
]

ci = [
    "pytest-github-actions-annotate-failures==0.3.0",
]

[tool.setuptools.packages.find]
where = ["."]  # list of folders that contain the packages (["."] by default)
include = ["rotkehlchen*", "rsqlite", "cytoolz"]

[project.scripts]
rotkehlchen = "rotkehlchen.__main__:main"
rotkehlchen_mock = "rotkehlchen_mock.__main__:main"

# Dependencies are now managed by uv
# [tool.setuptools.dynamic]
# dependencies = {file = ["requirements.txt"]}

[tool.setuptools_scm]
fallback_version = "1.43.2"

[tool.setuptools.package-data]
"rotkehlchen.data" = ["*"]
"rotkehlchen.chain" = ["ethereum/modules/dxdaomesa/data/contracts.json"]

# -- Mypy config section --

[tool.mypy]
# Docs: https://mypy.readthedocs.io/en/latest/config_file.html
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_configs = true
warn_unused_ignores = true
warn_unreachable = true
warn_redundant_casts = true
disallow_untyped_decorators = true
disallow_untyped_calls = true
mypy_path="./stubs/"

[[tool.mypy.overrides]]
module = "rotkehlchen.*"
ignore_missing_imports = false

# -- These modules still need to have proper type definitions given --
[[tool.mypy.overrides]]
module = "rotkehlchen.tests.*"
check_untyped_defs = false
disallow_untyped_defs = false
# Pytest's fixture decorators are not typed
disallow_untyped_decorators = false

