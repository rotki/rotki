[workspace]
resolver = "2"
members = [
    "colibri",
    "crates/starling",
    "crates/starling-core",
    "crates/starling-proxy",
]
exclude = ["tools/find-duplicate-constants"]

[workspace.package]
# Kept in lockstep with the rotki release version by `tools/scripts/bump.sh`
# (see the `Cargo.toml` entry in `.bumpversion.cfg`). Every member
# inherits it via `version.workspace = true`, so this is the single place the
# bump has to touch.
version = "1.44.2"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.88.0"
repository = "https://github.com/rotki/rotki"

# Exact-pinned, matching colibri's convention: reproducible builds, and a
# dependency bump is always a deliberate, reviewable diff rather than something
# that drifts in on the next lockfile refresh. An exact pin in any workspace
# member also constrains the transitive resolution of every other member.
[workspace.dependencies]
tokio = { version = "=1.54.1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "time",
    "signal",
    "net",
    "sync",
    "io-util",
    "io-std",
] }
async-trait = "=0.1.92"
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
clap = "=4.6.7"
axum = "=0.8.9"
dirs = "=6.0.0"
tower = "=0.5.3"
tower-http = "=0.6.11"

[profile.release]
strip = true
lto = "thin"
